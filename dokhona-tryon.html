<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokhona Virtual Try-On</title>
<style>
:root{--bg:#121214;--pn:#1c1c20;--fg:#f0f0f2;--mut:#9a9aa3;--ac:#e0507a;--ln:#2e2e35}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 320px;height:100dvh}
#view{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;padding:12px}
#stage{position:relative;background:#000;border-radius:12px;overflow:hidden;touch-action:none;box-shadow:0 8px 30px #0008}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#gl,#fx{pointer-events:none}
aside{background:var(--pn);border-left:1px solid var(--ln);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:17px;margin:0}h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button,.btn{background:#2a2a31;color:var(--fg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}
button.on,.btn.on{background:var(--ac);border-color:var(--ac)}
button:hover,.btn:hover{filter:brightness(1.2)}
input[type=file]{display:none}
.sl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);width:100%;margin-bottom:6px}.sl input{flex:1}
#dr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dg{padding:4px;height:104px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:11px}
.dg img{max-height:74px;max-width:100%;background:repeating-conic-gradient(#555 0 25%,#666 0 50%) 0 0/10px 10px;border-radius:4px}
.h{position:absolute;width:22px;height:22px;margin:-11px;border-radius:50%;background:#ffd400;border:2px solid #000;font:700 8px/18px sans-serif;text-align:center;color:#000;cursor:grab;touch-action:none;display:none}
.h.hold{background:#3ddc84;transform:scale(1.35)}
#st{font-size:12px;color:var(--mut);line-height:1.45}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:62dvh 1fr}aside{border-left:0;border-top:1px solid var(--ln)}}
</style></head><body>
<div id="app"><div id="view"><div id="stage"><canvas id="bg"></canvas><canvas id="gl"></canvas><canvas id="fx"></canvas></div></div>
<aside><h1>Dokhona virtual try-on</h1>
<div><h3>Source</h3><div class="row"><button id="bcam">Camera</button><label class="btn">Photo / video<input id="f" type="file" accept="image/*,video/*"></label><button id="bsam">Sample person</button></div></div>
<div><h3>Dokhona</h3><div id="dr"></div><div class="row" style="margin-top:6px"><label class="btn">Load dress folder<input id="df" type="file" webkitdirectory multiple></label></div></div>
<div><h3>Controls</h3>
<label class="sl">Wind<input id="wind" type="range" min="0" max="10" value="3"></label>
<label class="sl">Looseness<input id="loose" type="range" min="0" max="10" value="5"></label>
<div class="row"><button id="tp" class="on">Points</button><button id="tg" class="on">Hand gestures</button><button id="rs">Reset fit</button></div></div>
<div id="st"></div></aside></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
const $=id=>document.getElementById(id);
const bg=$('bg'),ctx=bg.getContext('2d'),fx=$('fx'),fc=fx.getContext('2d'),st=$('st'),stage=$('stage'),view=$('view'),gl=$('gl');
let W=480,H=720,media=null,stream=null,mode='none',ready=false,time=0,cloth=null,gw=10,gh=10,mirror=false,pose=null,hand=null,holdK=null,lost=0,hands=[],showPts=true,gest=true,lastP=0,lastH=0;
const K=['ls','rs','le','re','lh','rh','lk','rk','la','ra'],IDX=[11,12,13,14,23,24,25,26,27,28],GK=['sl','sr','el','er','hl','hr','kl','kr','al','ar'];
const B={},S={},adj={},hs={},GP={};K.forEach(k=>{B[k]=[0,0];S[k]=[0,0];adj[k]=[0,0]});
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const R=new THREE.WebGLRenderer({canvas:gl,alpha:true,antialias:true});R.setClearColor(0,0);
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(0,W,0,H,-10,10);
const C=28,RW=44,NV=(C+1)*(RW+1);
class Cloth{
 constructor(cv){const A=()=>new Float32Array(NV);this.x=A();this.y=A();this.px=A();this.py=A();this.rx=A();this.ry=A();
  this.tex=new THREE.CanvasTexture(cv);this.pos=new Float32Array(NV*3);this.col=new Float32Array(NV*3).fill(1);const uv=new Float32Array(NV*2),idx=[];
  for(let j=0;j<=RW;j++)for(let i=0;i<=C;i++){const m=j*(C+1)+i;uv[m*2]=i/C;uv[m*2+1]=1-j/RW;if(i<C&&j<RW){idx.push(m,m+C+1,m+1,m+1,m+C+1,m+C+2)}}
  this.geo=new THREE.BufferGeometry();this.geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
  this.geo.setAttribute('color',new THREE.BufferAttribute(this.col,3));this.geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));this.geo.setIndex(idx);
  this.mesh=new THREE.Mesh(this.geo,new THREE.MeshBasicMaterial({map:this.tex,vertexColors:true,side:THREE.DoubleSide,transparent:true,depthTest:false,depthWrite:false}));
  this.mesh.frustumCulled=false;scene.add(this.mesh);this.fresh=true}
 dispose(){scene.remove(this.mesh);this.geo.dispose();this.tex.dispose()}
 update(fn,wind,loose,sc){const {x,y,px,py,rx,ry}=this;
  for(let j=0;j<=RW;j++)for(let i=0;i<=C;i++){const p=fn(i/C,j/RW),n=j*(C+1)+i;rx[n]=p[0];ry[n]=p[1]}
  for(let j=0;j<=RW;j++){const t=j/RW,k=(.75-.68*Math.pow(t,.8))*(1-.55*loose)+.05;
   for(let i=0;i<=C;i++){const n=j*(C+1)+i;
    if(j==0||this.fresh){x[n]=px[n]=rx[n];y[n]=py[n]=ry[n];continue}
    const vx=(x[n]-px[n])*.95,vy=(y[n]-py[n])*.95;px[n]=x[n];py[n]=y[n];
    const w=wind*sc*1.8*Math.pow(t,1.3)*(Math.sin(time*2+j*.3+i*.25)+.5*Math.sin(time*3.3+i*.6));
    x[n]+=vx+(rx[n]-x[n])*k+w;y[n]+=vy+(ry[n]-y[n])*k+.1*sc*t+Math.abs(w)*.12}}
  for(let it=0;it<3;it++)for(let j=0;j<=RW;j++)for(let i=0;i<=C;i++){const a=j*(C+1)+i;
   for(const b of[i<C?a+1:-1,j<RW?a+C+1:-1]){if(b<0)continue;
    const dx=x[b]-x[a],dy=y[b]-y[a],d=Math.hypot(dx,dy)||1,d0=Math.hypot(rx[b]-rx[a],ry[b]-ry[a]),f=(d-d0)/d*.15;
    if(j>0||b!=a+C+1){x[a]+=dx*f;y[a]+=dy*f}x[b]-=dx*f;y[b]-=dy*f}}
  for(let i=0;i<=C;i++){x[i]=rx[i];y[i]=ry[i]}
  this.fresh=false;
  for(let n=0;n<NV;n++){const s=Math.max(.8,Math.min(1.1,1+(x[n]-rx[n])*.003));this.pos[n*3]=x[n];this.pos[n*3+1]=y[n];this.col[n*3]=this.col[n*3+1]=this.col[n*3+2]=s}
  this.geo.attributes.position.needsUpdate=this.geo.attributes.color.needsUpdate=true}
}

// ---- moving least squares warp: garment points p -> body points q ----
const wv=new Float64Array(10);
function mls(vx,vy,p,q){let sw=0,ps0=0,ps1=0,qs0=0,qs1=0;
 for(let i=0;i<10;i++){const dx=vx-p[i][0],dy=vy-p[i][1],w=1/Math.pow(dx*dx+dy*dy+1,1.2);wv[i]=w;sw+=w;ps0+=w*p[i][0];ps1+=w*p[i][1];qs0+=w*q[i][0];qs1+=w*q[i][1]}
 ps0/=sw;ps1/=sw;qs0/=sw;qs1/=sw;let a=0,b=0,d=0,n00=0,n01=0,n10=0,n11=0;
 for(let i=0;i<10;i++){const w=wv[i],p0=p[i][0]-ps0,p1=p[i][1]-ps1,q0=q[i][0]-qs0,q1=q[i][1]-qs1;
  a+=w*p0*p0;b+=w*p0*p1;d+=w*p1*p1;n00+=w*p0*q0;n01+=w*p0*q1;n10+=w*p1*q0;n11+=w*p1*q1}
 const det=(a*d-b*b)||1e-6,i00=d/det,i01=-b/det,i11=a/det;
 const m00=i00*n00+i01*n10,m01=i00*n01+i01*n11,m10=i01*n00+i11*n10,m11=i01*n01+i11*n11,r0=vx-ps0,r1=vy-ps1;
 return[r0*m00+r1*m10+qs0,r0*m01+r1*m11+qs1]}

function renderLib(){const d=$('dr');d.innerHTML='';lib.forEach((o,i)=>{const b=document.createElement('button');b.className='dg'+(o.on?' on':'');b.innerHTML='<img><span></span>';b.querySelector('img').src=o.src;b.querySelector('span').textContent=o.name;b.onclick=()=>useG(i);d.appendChild(b)})}
function useG(i){const o=lib[i],im=new Image();im.onload=()=>{gw=im.naturalWidth;gh=im.naturalHeight;const c=document.createElement('canvas');c.width=gw;c.height=gh;c.getContext('2d').drawImage(im,0,0);
 GK.forEach(k=>GP[k]=[o.pts[k][0]*gw,o.pts[k][1]*gh]);if(cloth)cloth.dispose();cloth=new Cloth(c);lib.forEach((x,j)=>x.on=j==i);renderLib()};im.src=o.src}
$('df').onchange=async e=>{const g={};
 for(const f of e.target.files){const p=f.webkitRelativePath||f.name,i=p.lastIndexOf('/'),dir=i<0?'':p.slice(0,i),nm=p.slice(i+1),d=nm.lastIndexOf('.'),stem=nm.slice(0,d).toLowerCase(),ext=nm.slice(d+1).toLowerCase(),key=dir+'|'+(stem=='dress'||stem=='points'?'':stem),o=g[key]=g[key]||{dir};
  if(ext=='json')o.j=f;else if(ext=='png'||ext=='webp')o.i=f}
 let n=0;for(const o of Object.values(g)){if(!o.i||!o.j)continue;try{const d=JSON.parse(await o.j.text()),p=d.points;
  if(!p||!GK.every(k=>p[k]&&isFinite(p[k][0])&&isFinite(p[k][1])))continue;lib.push({name:d.name||o.dir.split('/').pop()||'dress',src:URL.createObjectURL(o.i),pts:p});n++}catch(_){}}
 renderLib();if(n){useG(lib.length-n);st.textContent='Loaded '+n+' dress'+(n>1?'es':'')+' from the folder.'}else st.textContent='No valid dress found. Each dress needs an image (png/webp) and a points.json made with the Creator.'};

function fit(){const r=view.getBoundingClientRect(),s=Math.min((r.width-24)/W,(r.height-24)/H);stage.style.width=Math.floor(W*s)+'px';stage.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',fit);
function setSize(w,h){const s=Math.min(1,800/Math.max(w,h));W=Math.round(w*s);H=Math.round(h*s);bg.width=gl.width=fx.width=W;bg.height=gl.height=fx.height=H;R.setSize(W,H,false);cam.right=W;cam.bottom=H;cam.updateProjectionMatrix();fit()}

// ---- points: base (tracked or auto) + offsets kept relative to the body frame ----
const clampP=p=>{const m=.04*Math.min(W,H);return[Math.min(Math.max(p[0],m),W-m),Math.min(Math.max(p[1],m),H-m)]};
function frameOf(){const dx=B.rs[0]-B.ls[0],dy=B.rs[1]-B.ls[1],sc=Math.hypot(dx,dy)||1;return{sc,c:dx/sc,s:dy/sc}}
const target=(k,f)=>{const a=adj[k];return clampP([B[k][0]+f.sc*(f.c*a[0]-f.s*a[1]),B[k][1]+f.sc*(f.s*a[0]+f.c*a[1])])};
function setPoint(k,p){p=clampP(p);const f=frameOf(),dx=(p[0]-B[k][0])/f.sc,dy=(p[1]-B[k][1])/f.sc;adj[k]=[f.c*dx+f.s*dy,-f.s*dx+f.c*dy]}
K.forEach(k=>{const d=document.createElement('div');d.className='h';d.textContent=k.toUpperCase();stage.appendChild(d);hs[k]=d;
 d.onpointerdown=e=>{e.preventDefault();d.setPointerCapture(e.pointerId);d.onpointermove=m=>{const r=stage.getBoundingClientRect();setPoint(k,[(m.clientX-r.left)/r.width*W,(m.clientY-r.top)/r.height*H])};d.onpointerup=()=>d.onpointermove=null}});
function autoFit(){const tall=H/W>=1.5,f=tall?{sy:.22,hy:.5,ay:.93,sx:.17,hx:.12,ax:.1}:{sy:.2,hy:.58,ay:.97,sx:.12,hx:.1,ax:.08},c=.5,e=f.sy+.22*(f.ay-f.sy),k=(f.hy+f.ay)/2;
 const o={ls:[c-f.sx,f.sy],rs:[c+f.sx,f.sy],le:[c-f.sx-.04,e],re:[c+f.sx+.04,e],lh:[c-f.hx,f.hy],rh:[c+f.hx,f.hy],lk:[c-f.hx*.9,k],rk:[c+f.hx*.9,k],la:[c-f.ax,f.ay],ra:[c+f.ax,f.ay]};
 K.forEach(q=>B[q]=[o[q][0]*W,o[q][1]*H])}
function baseSample(){const s=W/media.naturalWidth;K.forEach(k=>B[k]=[SPT[k][0]*s,SPT[k][1]*s])}
function resetFit(){K.forEach(k=>adj[k]=[0,0]);if(mode=='sample')baseSample();else if(mode!='cam')autoFit()}
function note(){st.textContent=mode=='cam'?(pose&&hand?'Camera on. Stand back so your full body is visible. Make a fist near a yellow point to grab it, move your hand, then open your palm to release. Points keep their place relative to your body as you move.':pose?'Camera on with body tracking. Hand gestures are unavailable, so drag the points with the mouse.':'Camera on, but the tracking models did not load (internet needed). Drag the points with the mouse.'):'Drag the yellow points onto the shoulders, elbows, hips, knees and ankles to fit the dress. Use Camera for live tracking.'}
function start(m,w,h,md){if(stream&&md!='cam'){stream.getTracks().forEach(t=>t.stop());stream=null}media=m;mode=md;mirror=md=='cam';setSize(w,h);
 K.forEach(k=>adj[k]=[0,0]);md=='sample'?baseSample():autoFit();K.forEach(k=>S[k]=B[k].slice());holdK=null;ready=true;if(cloth)cloth.fresh=true;note()}

// ---- sources ----
$('bcam').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'},audio:false}),v=document.createElement('video');
 v.srcObject=s;v.playsInline=v.muted=true;await v.play();if(stream)stream.getTracks().forEach(t=>t.stop());stream=s;start(v,v.videoWidth,v.videoHeight,'cam')}catch(e){st.textContent='Camera unavailable: '+e.message}};
$('f').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);
 if(f.type.startsWith('video')){const v=document.createElement('video');v.src=u;v.loop=v.muted=v.playsInline=true;v.onloadedmetadata=()=>start(v,v.videoWidth,v.videoHeight,'video');v.play()}
 else{const im=new Image();im.onload=()=>start(im,im.naturalWidth,im.naturalHeight,'photo');im.src=u}};
function useSample(){const im=new Image();im.onload=()=>start(im,im.naturalWidth,im.naturalHeight,'sample');im.src=SAMPLEP}
$('bsam').onclick=useSample;$('rs').onclick=resetFit;
$('tp').onclick=e=>{showPts=!showPts;e.target.classList.toggle('on',showPts)};
$('tg').onclick=e=>{gest=!gest;e.target.classList.toggle('on',gest);if(!gest)holdK=null};

// ---- hand gestures: fist = grab nearest point, open palm = release ----
function doHands(r){hands=[];(r&&r.landmarks||[]).forEach(l=>{const d=(a,b)=>Math.hypot(l[a].x-l[b].x,l[a].y-l[b].y);let ex=0,cl=0;
 [[8,6],[12,10],[16,14],[20,18]].forEach(([t,p])=>{const q=d(t,0)/d(p,0);if(q>1.1)ex++;else if(q<.95)cl++});
 const px=[0,5,9,13,17].reduce((s,i)=>s+l[i].x,0)/5,py=[0,5,9,13,17].reduce((s,i)=>s+l[i].y,0)/5;
 hands.push({x:(mirror?1-px:px)*W,y:py*H,fist:cl>=3,open:ex>=3})});
 const Rg=.08*Math.hypot(W,H),fists=hands.filter(h=>h.fist);
 if(holdK){if(fists.length){const q=S[holdK];fists.sort((a,b)=>Math.hypot(a.x-q[0],a.y-q[1])-Math.hypot(b.x-q[0],b.y-q[1]));setPoint(holdK,[fists[0].x,fists[0].y]);lost=0}
  else if(hands.some(h=>h.open)||++lost>20)holdK=null}
 else for(const h of fists){let bk=null,bd=Rg;K.forEach(k=>{const d=Math.hypot(S[k][0]-h.x,S[k][1]-h.y);if(d<bd){bd=d;bk=k}});if(bk){holdK=bk;lost=0;break}}}
function track(){const t=performance.now();
 if(pose&&t>lastP){lastP=t;try{const l=(pose.detectForVideo(media,t).landmarks||[])[0];if(l)K.forEach((k,n)=>{const p=l[IDX[n]];B[k]=[(mirror?1-p.x:p.x)*W,p.y*H]})}catch(e){}}
 if(hand&&gest){const t2=performance.now();if(t2>lastH){lastH=t2;try{doHands(hand.detectForVideo(media,t2))}catch(e){}}}else{hands=[];holdK=null}}

// ---- models (need internet) ----
(async()=>{try{const b='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',m=await import(b+'/vision_bundle.mjs'),fs=await m.FilesetResolver.forVisionTasks(b+'/wasm'),M='https://storage.googleapis.com/mediapipe-models/';
 try{pose=await m.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:M+'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'},runningMode:'VIDEO',numPoses:1})}catch(e){}
 try{hand=await m.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:M+'hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:2})}catch(e){}
}catch(e){}if(mode!='none')note()})();

// ---- main loop ----
function frame(){requestAnimationFrame(frame);if(!ready)return;time+=.016;
 if(mirror){ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(media,0,0,W,H);ctx.restore()}else ctx.drawImage(media,0,0,W,H);
 if(mode=='cam')track();
 const f=frameOf();K.forEach(k=>{const t=target(k,f);S[k][0]+=(t[0]-S[k][0])*.45;S[k][1]+=(t[1]-S[k][1])*.45;
  const d=hs[k];d.style.display=showPts?'block':'none';d.style.left=S[k][0]/W*100+'%';d.style.top=S[k][1]/H*100+'%';d.classList.toggle('hold',holdK==k)});
 fc.clearRect(0,0,W,H);if(mode=='cam'&&gest){fc.lineWidth=4;hands.forEach(h=>{fc.beginPath();fc.arc(h.x,h.y,h.fist?14:26,0,7);fc.strokeStyle=h.fist?'#ff4d4d':'#3ddc84';fc.stroke()})}
 if(cloth){const sw=S.ls[0]>S.rs[0],side={l:sw?'r':'l',r:sw?'l':'r'},p=GK.map(k=>GP[k]),
  q=GK.map(k=>{const sd=side[k[1]];return k[0]=='e'?lerp(S[sd+'s'],S[sd+'e'],.4):S[sd+k[0]]});
  cloth.update((u,t)=>mls(u*gw,t*gh,p,q),$('wind').value/10,$('loose').value/10,W/480)}
 R.render(scene,cam)}
renderLib();useG(1);useSample();frame();
</script></body></html>
