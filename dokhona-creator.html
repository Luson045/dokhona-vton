<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokhona Dress Creator</title>
<style>
:root{--bg:#121214;--pn:#1c1c20;--fg:#f0f0f2;--mut:#9a9aa3;--ac:#e0507a;--ln:#2e2e35}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 320px;height:100dvh}
#view{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;padding:12px}
#stage{position:relative;border-radius:12px;overflow:hidden;touch-action:none;background:repeating-conic-gradient(#555 0 25%,#666 0 50%) 0 0/16px 16px;cursor:crosshair;display:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#empty{color:var(--mut)}
aside{background:var(--pn);border-left:1px solid var(--ln);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:17px;margin:0}h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 6px}
p{margin:0;color:var(--mut);font-size:12px;line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:6px}
button,.btn{background:#2a2a31;color:var(--fg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}
button:hover,.btn:hover{filter:brightness(1.2)}button:disabled{opacity:.4;cursor:default}
input[type=file]{display:none}
input[type=text]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--ln);background:#26262c;color:var(--fg);margin-bottom:6px}
ol{margin:0;padding:0;list-style:none;display:grid;gap:3px}
li{padding:5px 8px;border-radius:6px;font-size:12px;cursor:pointer;background:#25252b;display:flex;justify-content:space-between}
li.cur{background:var(--ac)}li.ok::after{content:"✓";color:#3ddc84}li.cur.ok::after{color:#fff}
.h{position:absolute;width:22px;height:22px;margin:-11px;border-radius:50%;background:#00d1ff;border:2px solid #000;font:700 8px/18px sans-serif;text-align:center;color:#000;cursor:grab;touch-action:none}
#st{font-size:12px;color:var(--mut);line-height:1.45}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:62dvh 1fr}aside{border-left:0;border-top:1px solid var(--ln)}}
</style></head><body>
<div id="app"><div id="view"><div id="empty">Upload a dress image to begin</div><div id="stage"><canvas id="cv"></canvas></div></div>
<aside><h1>Dokhona dress creator</h1>
<p>Upload a photo of the dress with a transparent background (PNG). Then mark the 10 body points. Left and right are as seen on the image.</p>
<div class="row"><label class="btn">Upload image<input id="f" type="file" accept="image/*"></label><button id="rb">Remove plain background</button></div>
<div><h3>Points: click the image to place the highlighted one</h3><ol id="pl"></ol></div>
<div><h3>Save dress</h3><input id="nm" type="text" placeholder="Dress name"><div class="row"><button id="sd">Save to folder</button><button id="sz">Download ZIP</button></div></div>
<div id="st"></div></aside></div>
<script>
const $=id=>document.getElementById(id);
const GK=['sl','sr','el','er','hl','hr','kl','kr','al','ar'];
const NAMES={sl:'Left shoulder seam',sr:'Right shoulder seam',el:'Left sleeve end',er:'Right sleeve end',hl:'Left waist / belt',hr:'Right waist / belt',kl:'Left knee level',kr:'Right knee level',al:'Left hem (ankle level)',ar:'Right hem (ankle level)'};
const cv=$('cv'),cx=cv.getContext('2d'),stage=$('stage'),view=$('view'),st=$('st');
let wc=document.createElement('canvas'),pts={},cur=0,hs={};
function crc32(u){let c,t=crc32.t||(crc32.t=Array.from({length:256},(_,n)=>{c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0}));let r=-1;for(const b of u)r=t[(r^b)&255]^(r>>>8);return(r^-1)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;for(const f of files){const n=enc.encode(f.name),d=f.data,crc=crc32(d);
 const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);parts.push(h.buffer,n,d);
 const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,n.length,true);c.setUint32(42,off,true);cen.push(c.buffer,n);off+=30+n.length+d.length}
 const cl=cen.reduce((s,b)=>s+b.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);return new Blob([...parts,...cen,e.buffer],{type:'application/zip'})}

function fit(){if(!wc.width)return;const r=view.getBoundingClientRect(),s=Math.min((r.width-24)/wc.width,(r.height-24)/wc.height);stage.style.width=Math.floor(wc.width*s)+'px';stage.style.height=Math.floor(wc.height*s)+'px'}
addEventListener('resize',fit);
const clampP=p=>{const m=.02*Math.min(wc.width,wc.height);return[Math.min(Math.max(p[0],m),wc.width-m),Math.min(Math.max(p[1],m),wc.height-m)]};
const toPx=e=>{const r=stage.getBoundingClientRect();return clampP([(e.clientX-r.left)/r.width*wc.width,(e.clientY-r.top)/r.height*wc.height])};
GK.forEach(k=>{const d=document.createElement('div');d.className='h';d.textContent=k.toUpperCase();d.style.display='none';stage.appendChild(d);hs[k]=d;
 d.onpointerdown=e=>{e.stopPropagation();e.preventDefault();d.setPointerCapture(e.pointerId);d.onpointermove=m=>{pts[k]=toPx(m);ui()};d.onpointerup=()=>d.onpointermove=null}});
function ui(){const l=$('pl');l.innerHTML='';GK.forEach((k,i)=>{const li=document.createElement('li');li.textContent=(i+1)+'. '+NAMES[k]+' ('+k.toUpperCase()+')';li.className=(i==cur?'cur ':'')+(pts[k]?'ok':'');li.onclick=()=>{cur=i;ui()};l.appendChild(li);
 const d=hs[k];d.style.display=pts[k]?'block':'none';if(pts[k]){d.style.left=pts[k][0]/wc.width*100+'%';d.style.top=pts[k][1]/wc.height*100+'%'}});
 const done=GK.every(k=>pts[k]);$('sd').disabled=$('sz').disabled=!done;st.textContent=done?'All 10 points placed. Name the dress and save it.':'Placing: '+NAMES[GK[cur]]}
stage.onpointerdown=e=>{if(!wc.width)return;pts[GK[cur]]=toPx(e);let n=GK.findIndex((k,i)=>i>cur&&!pts[k]);if(n<0)n=GK.findIndex(k=>!pts[k]);if(n>=0)cur=n;ui()};
function show(){cv.width=wc.width;cv.height=wc.height;cx.clearRect(0,0,wc.width,wc.height);cx.drawImage(wc,0,0);$('empty').style.display='none';stage.style.display='block';fit();ui()}
function crop(){const w=wc.width,h=wc.height,a=wc.getContext('2d').getImageData(0,0,w,h).data;let x0=w,x1=-1,y0=h,y1=-1;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(a[(y*w+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 if(x1<0)return false;const c=document.createElement('canvas');c.width=x1-x0+1;c.height=y1-y0+1;c.getContext('2d').drawImage(wc,x0,y0,c.width,c.height,0,0,c.width,c.height);wc=c;return true}
$('f').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight));wc=document.createElement('canvas');wc.width=Math.round(im.naturalWidth*s);wc.height=Math.round(im.naturalHeight*s);wc.getContext('2d').drawImage(im,0,0,wc.width,wc.height);
 pts={};cur=0;if(crop())show();else st.textContent='That image looks fully transparent or empty.'};im.src=URL.createObjectURL(f)};
$('rb').onclick=()=>{if(!wc.width)return;const w=wc.width,h=wc.height,g=wc.getContext('2d'),d=g.getImageData(0,0,w,h),a=d.data,N=w*h,bm=new Uint8Array(N),stk=[];
 const sat=o=>Math.max(a[o],a[o+1],a[o+2])-Math.min(a[o],a[o+1],a[o+2]),push=p=>{if(!bm[p]&&(a[p*4+3]<10||sat(p*4)<30)){bm[p]=1;stk.push(p)}};
 for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
 while(stk.length){const p=stk.pop(),x=p%w;if(x>0)push(p-1);if(x<w-1)push(p+1);if(p>=w)push(p-w);if(p<N-w)push(p+w)}
 const halo=[];for(let p=0;p<N;p++){if(bm[p])a[p*4+3]=0;else{const x=p%w;if(((x>0&&bm[p-1])||(x<w-1&&bm[p+1])||(p>=w&&bm[p-w])||(p<N-w&&bm[p+w]))&&sat(p*4)<60)halo.push(p*4+3)}}
 halo.forEach(o=>a[o]=0);g.putImageData(d,0,0);pts={};cur=0;if(crop())show()};
async function pack(){const name=($('nm').value.trim()||'dress'),safe=name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'dress',w=wc.width,h=wc.height,p={};
 GK.forEach(k=>p[k]=[+(pts[k][0]/w).toFixed(5),+(pts[k][1]/h).toFixed(5)]);
 const png=new Uint8Array(await (await new Promise(r=>wc.toBlob(r,'image/png'))).arrayBuffer()),json=new TextEncoder().encode(JSON.stringify({name,version:1,width:w,height:h,points:p},null,1));return{safe,png,json}}
$('sd').onclick=async()=>{try{const o=await pack();if(!window.showDirectoryPicker){st.textContent='Folder saving needs Chrome or Edge. Use Download ZIP instead.';return}
 const root=await showDirectoryPicker({mode:'readwrite'}),d=await root.getDirectoryHandle(o.safe,{create:true});
 for(const [n,data] of [['dress.png',o.png],['points.json',o.json]]){const fh=await d.getFileHandle(n,{create:true}),w=await fh.createWritable();await w.write(data);await w.close()}
 st.textContent='Saved to folder "'+o.safe+'" (dress.png + points.json). Put it inside your dresses folder.'}catch(e){if(e.name!='AbortError')st.textContent='Could not save: '+e.message}};
$('sz').onclick=async()=>{const o=await pack(),b=zip([{name:o.safe+'/dress.png',data:o.png},{name:o.safe+'/points.json',data:o.json}]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.safe+'.zip';a.click();st.textContent='Downloaded '+o.safe+'.zip. Unzip it into your dresses folder.'};
ui();
</script></body></html>
